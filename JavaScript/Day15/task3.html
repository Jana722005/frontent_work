<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Toggle</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .details {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.5s ease;
        }

        .details.show {
            max-height: 150px;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="./assets/image/pexels-photo-17461073.avif" alt="Laptop">
        <h2>Web Development</h2>
        <div id="details" class="details">
            <p>Learn HTML, CSS and JavaScript to build modern and interactive websites.</p>
        </div>
        <button id="detailsBtn">Show Details</button>

    </div>

    <script>
        const details = document.getElementById("details");
        const button = document.getElementById("detailsBtn");

        button.addEventListener("click", () => {

            details.classList.toggle("show");

            if (details.classList.contains("show")) {
                button.textContent = "Hide Details";
            } else {
                button.textContent = "Show Details";
            }
        });
    </script>

</body>
</html>
