<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend - Full Stack</title>

    <style>

        *{
            margin: 0;
            padding: 0;
        }

        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: white;
        }

        a{
            text-decoration: none;
        }

        header{
            padding: 20px;
            margin-left: 100px;
            margin-right: 100px;
        }


        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            border: none;
            border-radius: 0px;
            box-shadow: 0px 1px 1px -1px black;
            background-color:white;
        }

        .navbar h1 {
            color: rgb(65, 136, 75);
        }

        .navbar > nav{
            display: flex;
            gap: 60px;
            font-size: large;
            font-weight: bold;
            
        }

        nav a {
            color: rgb(56, 129, 84);
            transition: 0.5s;
        }

        nav > a:hover{
            transform: scale(1.2);
            border-radius: 10px;
        }

        .main{
            text-align: center;
            margin-top: 15%;
            color: rgb(62, 87, 169);
        }

    </style>
</head>
<body>
    <header>
        <div class="navbar">

            <h1>My Work</h1>
            
            <nav>
                <a href="pages/HTML.html">HTML</a>
                <a href="pages/CSS.html">CSS</a>
                <a href="pages/BOOTSTRAP.html">BOOTSTRAP</a>
                <a href="pages/JAVASCRIPT.html">JAVASCRIPT</a>
            </nav>
        </div>
    </header>

    <section>
            <main>
                <div class="main">
                    <h1>Welcome To MY WorkSpace.</h1>
                    <p>This is the page where My works have been updated based on the course.</p>
                </div>
            </main>
        </section>
</body>
</html>
