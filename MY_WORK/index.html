<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Frontend - Full Stack</title>

    <style>

        .main{
            text-align: center;
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            align-items: center;
            margin-top: 2%;
            gap:100px;
        }

        .main img{
            height: 85%;
            width: 85%;
        }

        @keyframes popIn {
        0% {
            opacity: 0;
            transform: scale(0.6);
        }
        100% {
            opacity: 1;
            transform: scale(1);
        }
        }

        .image {
            animation: popIn 1s ease-out forwards;
        }

        .two{
           animation: popIn 1s ease-out backwards; 
        }

        .intro h1{
            display:flex;
            text-align: justify;
        }

        .one{
            font-size: 2.5rem;
            color:#EFA82E;
        }
        .two{
            font-size: 4rem;
            color:rgb(62, 87, 169);
        }

    </style>
</head>
<body>
    <header>
        <div class="navbar">

            <h1>My Work</h1>
            
            <nav>
                <a href="pages/HTML.html">HTML</a>
                <a href="pages/CSS.html">CSS</a>
                <a href="pages/BOOTSTRAP.html">BOOTSTRAP</a>
                <a href="pages/JAVASCRIPT.html">JAVASCRIPT</a>
            </nav>
        </div>
    </header>

    <section>
            <main class="main">
                <div class="image">
                    <img src="Images/workspace.png" alt="workspace">
                </div>

                <div class="intro">
                    <h1 class="one"> Welcome to ,<br></h1>
                    <h1 class="two">Jana's WorkSpace</h1>
                </div>
            </main>
        </section>
</body>
</html>
