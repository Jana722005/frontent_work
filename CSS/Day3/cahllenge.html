<body>
     <h1>CSS Box Model Demonstration</h1>
    <div class="card student">
        <h2>Student Card</h2>
        <p>Name: John</p>
        <p>Department: CSE</p>
    </div>
    <div class="card employee">
        <h2>Employee Card</h2>
        <p>Name: Priya</p>
        <p>Department: HR</p>
    </div>
    <div class="card product">
        <h2>Product Card</h2>
        <p>Product: Laptop</p>
        <p>Price: ₹55,000</p>
    </div>
    <div class="card movie">
        <h2>Movie Card</h2>
        <p>Movie: Leo</p>
        <p>Hero: Vijay</p>
    </div>
    <div class="card company">
        <h2>Company Card</h2>
        <p>Company: Zoho</p>
        <p>Location: Chennai</p>
    </div>
</body>
