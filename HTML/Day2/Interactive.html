<!DOCTYPE html>
<html>
<head>
    <title>Interactive Elements</title>
</head>
<body>
    <h1>Interactive Elements</h1>
    <input type="text" placeholder="Enter your name"><br><br>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio><br><br>
    <video width="320" height="240" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video><br><br>
    <button>Click Me</button><br><br>
    <details>
        <summary>More Info</summary>
        <p>This is additional information that can be revealed by clicking the summary.</p>
    </details><br><br>
    <textarea placeholder="Enter your message"></textarea><br><br>
    <select>
        <option value="option1">Option 1</option>
        <option value="option2">Option 2</option>
        <option value="option3">Option 3</option>
    </select><br><br>
    <a href="https://www.example.com" target="_blank">Visit Example.com</a><br><br>
</body>
</html>
