<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>
<body>
    <section>
        <div>
            <form>
                <h1>Feedback form</h1>
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <br>
                <br>
                <label for="mail">Email:</label>
                <input type="email" id="mail" required>
                <br>
                <br>
                <label for="q1">1. How satisfied are you with our product/service?</label>
                <br>
                <br>
                <input type="radio" name="" id="q1" required>Good
                <input type="radio" name="" id="q1" required>Not good
                <br>
                <br>
                <label for="q2">2. What can we improve?</label>
                <br>
                <br>
                <textarea name="" id="q2"></textarea>
                <br>
                <br>
                <label for="q3">3. Would you recommend us to others?</label>
                <br>
                <br>
                <input type="radio" id="q3">yes
                <input type="radio" id="q3">No
                <br>
                <br>
                <button type="submit">Submit</button>
            </form>
        </div>
    </section>
</body>
</html>
