<!DOCTYPE html>
<html>
<head>
    <title>Simple Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form>

        <h2>1. Personal Information</h2>

        <label for="fullname">Full Name:</label>
        <input id="fullname"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob"><br><br>

        <label>Gender:</label><br>
        <input type="radio">Male
        <input type="radio">female
        <input type="radio">others<br><br>

        <label for="contact">Contact Number:</label>
        <input type="tel" id="contact"><br><br>

        <label for="email">Email Address:</label>
        <input id="email"><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address"></textarea>

        <h2>2. Position Details</h2>

        <label for="position">Position Applied For:</label>
        <input id="position"><br><br>

        <label for="salary">Expected Salary:</label>
        <input id="salary"><br><br>

        <h2>3. Education</h2>
        <br>
        <label for="edu">Branch:</label>
        <input type="text">
        <br>
        <br>
        <label for="edu1">Department:</label>
        <input type="text" name="" id="edu1">

        <h2>4. Skills &amp; Certifications</h2>

        <textarea id="skills"></textarea>
        <input type="file">

        <h2>5. References</h2>

        <label for="refname">Name:</label><br>
        <input id="refname"><br><br>

        <label for="relationship">Relationship:</label><br>
        <input id="relationship"><br><br>

        <label for="refcontact">Contact:</label><br>
        <input type="tel" id="refcontact">

        <h2>6. Declaration</h2>

        <p>
            I hereby declare that the information provided above is true and
            correct to the best of my knowledge.
        </p>

        <label for="signature">Signature:</label><br>
        <input id="signature"><br><br>

        <label for="date">Date:</label><br>
        <input type="date" id="date"><br><br>

        <button type="submit">Submit Application</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
