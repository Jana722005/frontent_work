<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <section>
        <div>
            <center>
            <form>
                <h1>Register Form</h1>
                <table cellpadding="10" cellspacing="10">
                    <tr>
                        <td><label for="name">Enter the Name:</label></td>
                        <td><input type="text" id="name" required></td>
                    </tr>

                    <tr>
                        <td><label for="mail">Enter the Email:</label></td>
                        <td><input type="email" id="mail" required></td>
                    </tr>

                    <tr>
                        <td><label for="contact">Contact No:</label></td>
                        <td><input type="tel" id="contact" required></td>
                    </tr>

                    <tr>
                        <td><label>Gender:</label></td>
                        <td><input type="radio">Male</td>
                        <td><input type="radio">Female</td>
                    </tr>
                    
                    <tr>
                        <td><label for="address">Adderss:</label></td>
                        <td><textarea name="" id="address"></textarea></td>
                    </tr>

                    <tr>
                        <td><label for="password">Password:</label></td>
                        <td><input type="password" id="password"></td>
                    </tr>

                    <tr>
                        <td><button type="submit">Submit</button></td>
                    </tr>
                </table>
            </form>
            </center>
        </div>
    </section>
</body>
</html>
