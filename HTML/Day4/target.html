<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <div>
            <h1>using target attribute</h1>
        </div>
    </header>

    <main>
        <div>
            <h1>Google Link : <a href="https://www.bing.com/" target="_blank">Link</a></h1>
            <h2>YouTube Link: <a href="https://www.youtube.com/" target="_blank">Link</a></h2>
            <h3>GitHub Link : <a href="https://github.com/" target="_blank">Link</a></h3>
            <h3>Facebook : <a href="https://www.facebook.com/">Link</a></h3>
            <h3>Instagram : <a href="https://www.instagram.com/">Link</a></h3>
        </div>
    </main>
</body>
</html>
